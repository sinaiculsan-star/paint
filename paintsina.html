      const entry = manifest[uuid];

            while (true) {
              const { done, value } = await reader.read();

    setStatus('Rendering...');

    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.

    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>

    // attributes through, so match the full opening tag. slice() rather than

    }

    console.error('Bundle unpack error:', err);
  }

;\n    border-color: #fff #000 #000 #fff;\n    box-shadow: inset -1px -1px 0 #808080, inset 1px 1px 0 #dfdfdf;\n  }\n  .sticker-cats::-webkit-scrollbar-track {\n    background: repeating-conic-gradient(#c0c0c0 0% 25%, #dfdfdf 0% 50%) 0 0/2px 2px;\n  }\n  .sticker-cat-row {\n    padding: 3px 6px;\n    display: flex; align-items: center; gap: 8px;\n    cursor: default;\n    font-size: 11px;\n    color: #000;\n    white-space: nowrap;\n  }\n  .sticker-cat-row.active { background: #000080; color: #fff; }\n  .sticker-cat-row .cat-ico {\n    width: 18px; height: 18px;\n    display: flex; align-items: center; justify-content: center;\n    font-size: 14px; flex-shrink: 0;\n  }\n  .sticker-cat-row .cat-ico svg { display: block; }\n\n  .sticker-right {\n    flex: 1; display: flex; flex-direction: column; gap: 4px;\n    min-width: 0;\n  }\n  .sticker-cat-name {\n    font-size: 11px;\n    padding-left: 1px;\n  }\n  .sticker-grid-wrap {\n    height: 300px;\n    background: #ffffff;\n    overflow-y: scroll;\n    padding: 2px;\n  }\n  .sticker-grid-wrap::-webkit-scrollbar { width: 16px; background: #c0c0c0; }\n  .sticker-grid-wrap::-webkit-scrollbar-thumb {\n    background: #c0c0c0;\n    border: 1px solid;\n    border-color: #fff #000 #000 #fff;\n    box-shadow: inset -1px -1px 0 #808080, inset 1px 1px 0 #dfdfdf;\n  }\n  .sticker-grid-wrap::-webkit-scrollbar-track {\n    background: repeating-conic-gradient(#c0c0c0 0% 25%, #dfdfdf 0% 50%) 0 0/2px 2px;\n  }\n  .sticker-grid {\n    display: grid;\n    grid-template-columns: repeat(4, 1fr);\n    gap: 4px;\n    padding: 2px;\n  }\n  .sticker-cell {\n    aspect-ratio: 1;\n    background: #ffffff;\n    border: 1px solid #ffffff;\n    display: flex; align-items: center; justify-content: center;\n    cursor: default;\n    position: relative;\n    font-size: 34px;\n    line-height: 1;\n    font-family: \"Segoe UI Emoji\", \"Apple Color Emoji\", \"Noto Color Emoji\", sans-serif;\n  }\n  .sticker-cell:hover {\n    border: 1px solid #808080;\n    background: #f4f4f4;\n  }\n  .sticker-cell.selected {\n    background: #c8d6f0;\n    border: 1px solid #808080;\n    box-shadow: inset 1px 1px 0 #404040;\n  }\n  .sticker-cell svg { width: 80%; height: 80%; display: block; }\n\n  .sticker-footer {\n    background: #c0c0c0;\n    padding: 4px 12px 12px;\n    display: flex;\n    justify-content: flex-end;\n    gap: 6px;\n  }\n  .btn.disabled { color: #808080; }\n  .btn.disabled:active { border-color: #fff #000 #000 #fff; }\n\n  /* Sticker placement cursor + ghost */\n  .canvas-wrap.placing #drawCanvas { cursor: copy; }\n  #stickerGhost {\n    position: absolute;\n    pointer-events: none;\n    opacity: 0.65;\n    z-index: 7;\n    font-size: 48px;\n    line-height: 1;\n    font-family: \"Segoe UI Emoji\", \"Apple Color Emoji\", \"Noto Color Emoji\", sans-serif;\n    transform: translate(-50%, -50%);\n    display: none;\n  }\n  #stickerGhost.show { display: block; }\n  #stickerGhost svg { display: block; }\n<\u002Fstyle>\n<\u002Fhead>\n<body>\n\n<div class=\"desktop\">\n  <div class=\"window outset\" id=\"appWindow\">\n\n    <!-- Title bar -->\n    <div class=\"title-bar\">\n      <svg class=\"title-icon\" viewBox=\"0 0 16 16\" shape-rendering=\"crispEdges\">\n        <rect x=\"1\" y=\"2\" width=\"14\" height=\"11\" fill=\"#fff\" stroke=\"#000\"><\u002Frect>\n        <rect x=\"2\" y=\"3\" width=\"3\" height=\"2\" fill=\"#ff0000\"><\u002Frect>\n        <rect x=\"5\" y=\"3\" width=\"3\" height=\"2\" fill=\"#ffff00\"><\u002Frect>\n        <rect x=\"8\" y=\"3\" width=\"3\" height=\"2\" fill=\"#00aa00\"><\u002Frect>\n        <rect x=\"11\" y=\"3\" width=\"3\" height=\"2\" fill=\"#0000ff\"><\u002Frect>\n        <rect x=\"3\" y=\"6\" width=\"10\" height=\"1\" fill=\"#888\"><\u002Frect>\n        <rect x=\"3\" y=\"8\" width=\"7\" height=\"1\" fill=\"#888\"><\u002Frect>\n        <rect x=\"3\" y=\"10\" width=\"9\" height=\"1\" fill=\"#888\"><\u002Frect>\n      <\u002Fsvg>\n      <span class=\"title-text\" id=\"windowTitle\">un v>\n          <div class=\"dd-item disabled\">Exit<span>Alt+F4<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"menu-item\" data-menu=\"edit\"><span class=\"u\">E<\u002Fspan>dit\n        <div class=\"dropdown\">\n          <div class=\"dd-item\" data-action=\"undo\">Undo<span>Ctrl+Z<\u002Fspan><\u002Fdiv>\n          <div class=\"dd-item\" data-action=\"redo\">Repeat<span>Ctrl+Y<\u002Fspan><\u002Fdiv>\n          <div class=\"dd-sep\"><\u002Fdiv>\n          <div class=\"dd-item disabled\">Cut<span>Ctrl+X<\u002Fspan><\u002Fdiv>\n          <div class=\"dd-item disabled\">Copy<span>Ctrl+C<\u002Fspan><\u002Fdiv>\n          <div class=\"dd-item disabled\">Paste<span>Ctrl+V<\u002Fspan><\u002Fdiv>\n          <div class=\"dd-item\" data-action=\"clear\">Clear Selection<span>Del<\u002Fspan><\u002Fdiv>\n          <div class=\"dd-item\" data-action=\"selectAll\">Select All<span>Ctrl+A<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"menu-item\" data-menu=\"view\"><span class=\"u\">V<\u002Fspan>iew\n        <div class=\"dropdown\">\n          <div class=\"dd-item\">Tool Box<span>Ctrl+T<\u002Fspan><\u002Fdiv>\n          <div class=\"dd-item\">Color Box<span>Ctrl+L<\u002Fspan><\u002Fdiv>\n          <div class=\"dd-item\">Status Bar<\u002Fdiv>\n          <div class=\"dd-sep\"><\u002Fdiv>\n          <div class=\"dd-item disabled\">Zoom<\u002Fdiv>\n          <div class=\"dd-item disabled\">View Bitmap<span>Ctrl+F<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"menu-item\" data-menu=\"image\"><span class=\"u\">I<\u002Fspan>mage\n        <div class=\"dropdown\">\n          <div class=\"dd-item\" data-action=\"flipH\">Flip Horizontal<\u002Fdiv>\n          <div class=\"dd-item\" data-action=\"flipV\">Flip Vertical<\u002Fdiv>\n          <div class=\"dd-item\" data-action=\"invert\">Invert Colors<span>Ctrl+I<\u002Fspan><\u002Fdiv>\n          <div class=\"dd-sep\"><\u002Fdiv>\n          <div class=\"dd-item\" data-action=\"attributes\">Attributes...<span>Ctrl+E<\u002Fspan><\u002Fdiv>\n          <div class=\"dd-item\" data-action=\"clearImage\">Clear Image<span>Ctrl+Shift+N<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"menu-item\" data-menu=\"options\"><span class=\"u\">O<\u002Fspan>ptions\n        <div class=\"dropdown\">\n          <div class=\"dd-item\">Edit Colors...<\u002Fdiv>\n          <div class=\"dd-item\">Get Colors...<\u002Fdiv>\n          <div class=\"dd-item\">Save Colors...<\u002Fdiv>\n          <div class=\"dd-sep\"><\u002Fdiv>\n          <div class=\"dd-item\">Draw Opaque<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"menu-item\" data-menu=\"help\"><span class=\"u\">H<\u002Fspan>elp\n        <div class=\"dropdown\">\n          <div class=\"dd-item disabled\">Help Topics<\u002Fdiv>\n          <div class=\"dd-sep\"><\u002Fdiv>\n          <div class=\"dd-item\" data-action=\"about\">About PixelPad<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- App body -->\n    <div class=\"app-body\">\n\n      <!-- Left tool palette -->\n      <div class=\"tools with-stk\">\n        <div class=\"tools-grid outset-thin\" style=\"background:#c0c0c0; padding:1px;\" id=\"toolGrid\">\n          <!-- 16 tools, populated by JS -->\n        <\u002Fdiv>\n\n        <!-- Sticker tool (separate, visually distinct - purple) -->\n        <div class=\"sticker-tool\" id=\"stickerBtn\" title=\"Stickers\">\n          <svg width=\"22\" height=\"22\" viewBox=\"0 0 22 22\" shape-rendering=\"crispEdges\">\n            <polygon points=\"6,1 10,5 6,9 2,5\" fill=\"#ffffff\"><\u002Fpolygon>\n            <polygon points=\"16,1 20,5 16,9 12,5\" fill=\"#ffffff\"><\u002Fpolygon>\n            <polygon points=\"6,13 10,17 6,21 2,17\" fill=\"#ffffff\"><\u002Fpolygon>\n            <polygon points=\"16,13 20,17 16,21 12,17\" fill=\"#ffffff\"><\u002Fpolygon>\n          <\u002Fsvg>\n          <div class=\"stk-label\">Stickers<\u002Fdiv>\n        <\u002Fdiv>\n\n        <!-- Tool options -->\n        <div class=\"tool-options inset-thin\" id=\"toolOptions\">\n          <!-- populated by JS based on selected tool -->\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <!-- Canvas + scroll -->\n      <div class=\"canvas-wrap inset\">\n        <div class=\"canvas-scroll\" id=\"canvasScroll\">\n          <div class=\"canvas-pad\">\n            <div class=\"canvas-frame\" id=\"canvasFrame\">\n              <canvas id=\"drawCanvas\" width=\"640\" height=\"460\"><\u002Fcanvas>\n              <canvas id=\"overlayCanvas\" width=\"640\" height=\"460\"><\u002Fcanvas>\n              <div id=\"stickerGhost\"><\u002Fdiv>\n              <div class=\"resize-handle rh-e\" data-rh=\"e\"><\u002Fdiv>\n              <div class=\"resize-handle rh-s\" data-rh=\"s\"><\u002Fdiv>\n              <div class=\"resize-handle rh-se\" data-rh=\"se\"><\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- Color palette -->\n    <div class=\"palette-bar\">\n      <div class=\"current-colors\" title=\"Current foreground / background\">\n        <div class=\"cc-bg\" id=\"ccBg\"><\u002Fdiv>\n        <div class=\"cc-fg\" id=\"ccFg\"><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"palette\" id=\"palette\"><\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- Status bar -->\n    <div class=\"status-bar\">\n      <div class=\"sb-cell inset-thin flex\" id=\"sbHelp\" style=\"background:#c0c0c0;\">For Help, click Help Topics on the Help Menu.<\u002Fdiv>\n      <div class=\"sb-cell inset-thin fixed\" id=\"sbCoord\" style=\"background:#c0c0c0;\"><\u002Fdiv>\n      <div class=\"sb-cell inset-thin fixed\" id=\"sbSize\" style=\"background:#c0c0c0;\"><\u002Fdiv>\n    <\u002Fdiv>\n\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<!-- Camera modal -->\n<div class=\"modal-bg\" id=\"cameraModal\">\n  <div class=\"modal outset\" style=\"width: 380px;\">\n    <div class=\"title-bar\">\n      <svg class=\"title-icon\" viewBox=\"0 0 16 16\" shape-rendering=\"crispEdges\">\n        <rect x=\"1\" y=\"4\" width=\"14\" height=\"10\" fill=\"#404040\" stroke=\"#000\"><\u002Frect>\n        <rect x=\"5\" y=\"2\" width=\"5\" height=\"3\" fill=\"#404040\" stroke=\"#000\"><\u002Frect>\n        <circle cx=\"8\" cy=\"9\" r=\"3\" fill=\"#000\" stroke=\"#fff\"><\u002Fcircle>\n        <circle cx=\"8\" cy=\"9\" r=\"1.5\" fill=\"#88ccff\"><\u002Fcircle>\n        <rect x=\"12\" y=\"5\" width=\"2\" height=\"2\" fill=\"#ff0000\"><\u002Frect>\n      <\u002Fsvg>\n      <span class=\"title-text\">Capture from Camera<\u002Fspan>\n      <div class=\"controls\">\n        <div class=\"tb-btn outset-thin\" id=\"closeCamera\">\n          <svg width=\"8\" height=\"8\" viewBox=\"0 0 8 8\" shape-rendering=\"crispEdges\"><path d=\"M1,1 L7,7 M7,1 L1,7\" stroke=\"#000\" stroke-width=\"1.2\" fill=\"none\"><\u002Fpath><\u002Fsvg>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"modal-body\" style=\"flex-direction: column; align-items: center; gap: 10px;\">\n      <div class=\"inset\" style=\"padding: 2px; background: #000;\">\n        <div style=\"position: relative; width: 320px; height: 240px; background: #000;\">\n          <video id=\"camVideo\" autoplay=\"\" playsinline=\"\" muted=\"\" style=\"width: 320px; height: 240px; display: block; object-fit: cover; image-rendering: pixelated;\"><\u002Fvideo>\n          <canvas id=\"camPreview\" width=\"320\" height=\"240\" style=\"position:absolute; inset:0; display:none; image-rendering: pixelated;\"><\u002Fcanvas>\n          <div id=\"camStatus\" style=\"position:absolute; inset:0; display:flex; align-items:center; justify-content:center; color:#88ff88; font-family: monospace; font-size: 11px; text-align:center; padding: 20px;\">\n            Click \"Start Camera\" to begin.<br>Browser will ask permission.\n          <\u002Fdiv>\n          <div id=\"camFlash\" style=\"position:absolute; inset:0; background:#fff; opacity:0; pointer-events:none;\"><\u002Fdiv>\n          <div style=\"position:absolute; top:4px; left:4px; color:#ff4040; font-family: monospace; font-size: 10px; text-shadow: 1px 1px 0 #000;\" id=\"camRecDot\"><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:flex; align-items:center; gap: 8px; font-size: 11px;\">\n        <label><input type=\"checkbox\" id=\"camDither\"> Dither (1-bit retro)<\u002Flabel>\n        <label><input type=\"checkbox\" id=\"camGray\"> Grayscale<\u002Flabel>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"modal-footer\" style=\"justify-content: space-between;\">\n      <div class=\"btn outset\" id=\"camStartBtn\">Start Camera<\u002Fdiv>\n      <div style=\"display:flex; gap:6px;\">\n        <div class=\"btn outset\" id=\"camSnapBtn\">Snap!<\u002Fdiv>\n        <div class=\"btn outset\" id=\"camRetakeBtn\" style=\"display:none;\">Retake<\u002Fdiv>\n        <div class=\"btn outset\" id=\"camInsertBtn\" style=\"display:none;\">Insert<\u002Fdiv>\n        <div class=\"btn outset\" id=\"camCancelBtn\">Cancel<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<!-- Sticker picker modal -->\n<div class=\"modal-bg\" id=\"stickerModal\">\n  <div class=\"modal outset sticker-modal\">\n    <div class=\"title-bar\">\n      <svg class=\"title-icon\" viewBox=\"0 0 16 16\" shape-rendering=\"crispEdges\">\n        <polygon points=\"4,1 6,3 4,5 2,3\" fill=\"#c4b5fd\"><\u002Fpolygon>\n        <polygon points=\"12,1 14,3 12,5 10,3\" fill=\"#c4b5fd\"><\u002Fpolygon>\n        <polygon points=\"4,9 6,11 4,13 2,11\" fill=\"#c4b5fd\"><\u002Fpolygon>\n        <polygon points=\"12,9 14,11 12,13 10,11\" fill=\"#c4b5fd\"><\u002Fpolygon>\n      <\u002Fsvg>\n      <span class=\"title-text\">Stickers<\u002Fspan>\n      <div class=\"controls\">\n        <div class=\"tb-btn outset-thin\" id=\"closeStickers\">\n          <svg width=\"8\" height=\"8\" viewBox=\"0 0 8 8\" shape-rendering=\"crispEdges\"><path d=\"M1,1 L7,7 M7,1 L1,7\" stroke=\"#000\" stroke-width=\"1.2\" fill=\"none\"><\u002Fpath><\u002Fsvg>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"sticker-body\">\n      <div class=\"sticker-cats-col\">\n        <div class=\"cats-lbl\">Categories:<\u002Fdiv>\n        <div class=\"sticker-cats inset-thin\" id=\"stickerCats\"><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"sticker-right\">\n        <div class=\"sticker-cat-name\" id=\"stickerCatName\">Cats<\u002Fdiv>\n        <div class=\"sticker-grid-wrap inset-thin\">\n          <div class=\"sticker-grid\" id=\"stickerGrid\"><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"sticker-footer\">\n      <div class=\"btn outset disabled\" id=\"stickerInsertBtn\">Insert<\u002Fdiv>\n      <div class=\"btn outset\" id=\"stickerCancelBtn\">Cancel<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<!-- About modal -->\n<div class=\"modal-bg\" id=\"aboutModal\">\n  <div class=\"modal outset\">\n    <div class=\"title-bar\">\n      <span class=\"title-text\">About PixelPad<\u002Fspan>\n      <div class=\"controls\">\n        <div class=\"tb-btn outset-thin\" id=\"closeAbout\">\n          <svg width=\"8\" height=\"8\" viewBox=\"0 0 8 8\" shape-rendering=\"crispEdges\"><path d=\"M1,1 L7,7 M7,1 L1,7\" stroke=\"#000\" stroke-width=\"1.2\" fill=\"none\"><\u002Fpath><\u002Fsvg>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"modal-body\">\n      <svg width=\"48\" height=\"48\" viewBox=\"0 0 48 48\" shape-rendering=\"crispEdges\">\n        <rect x=\"2\" y=\"6\" width=\"44\" height=\"36\" fill=\"#fff\" stroke=\"#000\"><\u002Frect>\n        <rect x=\"4\" y=\"8\" width=\"10\" height=\"6\" fill=\"#ff0000\"><\u002Frect>\n        <rect x=\"14\" y=\"8\" width=\"10\" height=\"6\" fill=\"#ffff00\"><\u002Frect>\n        <rect x=\"24\" y=\"8\" width=\"10\" height=\"6\" fill=\"#00aa00\"><\u002Frect>\n        <rect x=\"34\" y=\"8\" width=\"10\" height=\"6\" fill=\"#0000ff\"><\u002Frect>\n        <rect x=\"6\" y=\"18\" width=\"34\" height=\"2\" fill=\"#666\"><\u002Frect>\n        <rect x=\"6\" y=\"22\" width=\"24\" height=\"2\" fill=\"#666\"><\u002Frect>\n        <rect x=\"6\" y=\"26\" width=\"30\" height=\"2\" fill=\"#666\"><\u002Frect>\n        <rect x=\"6\" y=\"30\" width=\"18\" height=\"2\" fill=\"#666\"><\u002Frect>\n        <rect x=\"6\" y=\"34\" width=\"26\" height=\"2\" fill=\"#666\"><\u002Frect>\n      <\u002Fsvg>\n      <div>\n        <p><b>PixelPad<\u002Fb><\u002Fp>\n        <p>Version 1.0 — a tiny retro drawing app.<\u002Fp>\n        <p>Inspired by the chunky-bevel desktop era.<\u002Fp>\n        <p style=\"margin-top:10px; color:#444;\">© 1998 PixelPad Software<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"modal-footer\">\n      <div class=\"btn outset\" id=\"closeAboutOk\">OK<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<script>\n/* ===================================================================\n   PixelPad — retro drawing app\n   =================================================================== */\n\n/* ---------- Tool definitions (icons inline-SVG, pixel style) ---------- */\nconst toolDefs = [\n  { id: 'select-free', name: 'Free-form Select',\n    icon: `<polyline points=\"2,8 3,5 6,3 9,2 12,4 13,8 11,12 8,13 5,12 3,10\" fill=\"none\" stroke=\"#000\" stroke-dasharray=\"1,1\"/>` },\n  { id: 'select-rect', name: 'Select',\n    icon: `<rect x=\"2\" y=\"3\" width=\"11\" height=\"9\" fill=\"none\" stroke=\"#000\" stroke-dasharray=\"2,1\"/>` },\n  { id: 'eraser', name: 'Eraser',\n    icon: `<polygon points=\"3,11 7,3 13,5 9,13\" fill=\"#fff\" stroke=\"#000\"/><polyline points=\"3,11 9,13\" stroke=\"#000\" fill=\"none\"/><rect x=\"2\" y=\"12\" width=\"9\" height=\"2\" fill=\"#ff80c0\" stroke=\"#000\"/>` },\n  { id: 'fill', name: 'Fill With Color',\n    icon: `<path d=\"M3,8 L8,3 L13,8 L8,13 Z\" fill=\"#ccc\" stroke=\"#000\"/><rect x=\"11\" y=\"9\" width=\"2\" height=\"4\" fill=\"#ff8800\"/><circle cx=\"12\" cy=\"13\" r=\"1\" fill=\"#0000aa\"/>` },\n  { id: 'picker', name: 'Pick Color',\n    icon: `<path d=\"M2,14 L4,12 L9,7 L11,9 L6,14 Z\" fill=\"#fff\" stroke=\"#000\"/><rect x=\"9\" y=\"3\" width=\"4\" height=\"4\" transform=\"rotate(45 11 5)\" fill=\"#888\" stroke=\"#000\"/>` },\n  { id: 'zoom', name: 'Magnifier',\n    icon: `<circle cx=\"6\" cy=\"6\" r=\"4\" fill=\"#fff\" stroke=\"#000\"/><line x1=\"9\" y1=\"9\" x2=\"14\" y2=\"14\" stroke=\"#000\" stroke-width=\"2\"/><line x1=\"4\" y1=\"6\" x2=\"8\" y2=\"6\" stroke=\"#000\"/><line x1=\"6\" y1=\"4\" x2=\"6\" y2=\"8\" stroke=\"#000\"/>` },\n  { id: 'pencil', name: 'Pencil',\n    icon: `<polygon points=\"2,13 3,10 11,2 13,4 5,12\" fill=\"#ffcc00\" stroke=\"#000\"/><polygon points=\"11,2 13,4 12,5 10,3\" fill=\"#888\" stroke=\"#000\"/><polygon points=\"2,13 3,10 5,12\" fill=\"#000\"/>` },\n  { id: 'brush', name: 'Brush',\n    icon: `<rect x=\"9\" y=\"3\" width=\"3\" height=\"4\" fill=\"#888\" stroke=\"#000\" transform=\"rotate(-30 10 5)\"/><polygon points=\"6,8 9,5 11,7 8,10\" fill=\"#000\" stroke=\"#000\"/><polyline points=\"3,14 6,11 8,13 5,15\" fill=\"#553300\" stroke=\"#000\"/>` },\n  { id: 'spray', name: 'Airbrush',\n    icon: `<polygon points=\"2,13 5,10 8,12 5,15\" fill=\"#888\" stroke=\"#000\"/><line x1=\"8\" y1=\"11\" x2=\"14\" y2=\"5\" stroke=\"#000\"/><circle cx=\"13\" cy=\"3\" r=\"0.5\" fill=\"#000\"/><circle cx=\"11\" cy=\"3\" r=\"0.5\" fill=\"#000\"/><circle cx=\"14\" cy=\"5\" r=\"0.5\" fill=\"#000\"/><circle cx=\"12\" cy=\"6\" r=\"0.5\" fill=\"#000\"/><circle cx=\"10\" cy=\"4\" r=\"0.5\" fill=\"#000\"/><circle cx=\"14\" cy=\"2\" r=\"0.5\" fill=\"#000\"/>` },\n  { id: 'text', name: 'Text',\n    icon: `<text x=\"3\" y=\"13\" font-family=\"serif\" font-weight=\"bold\" font-size=\"14\" fill=\"#000\">A<\u002Ftext>` },\n  { id: 'line', name: 'Line',\n    icon: `<line x1=\"2\" y1=\"13\" x2=\"13\" y2=\"2\" stroke=\"#000\" stroke-width=\"1.2\"/>` },\n  { id: 'curve', name: 'Curve',\n    icon: `<path d=\"M2,13 C5,2 11,2 13,13\" fill=\"none\" stroke=\"#000\" stroke-width=\"1.2\"/>` },\n  { id: 'rect', name: 'Rectangle',\n    icon: `<rect x=\"2\" y=\"4\" width=\"11\" height=\"8\" fill=\"none\" stroke=\"#000\"/>` },\n  { id: 'polygon', name: 'Polygon',\n    icon: `<polygon points=\"3,12 2,5 7,2 12,5 13,11 8,14\" fill=\"none\" stroke=\"#000\"/>` },\n  { id: 'ellipse', name: 'Ellipse',\n    icon: `<ellipse cx=\"7.5\" cy=\"8\" rx=\"6\" ry=\"4.5\" fill=\"none\" stroke=\"#000\"/>` },\n  { id: 'rrect', name: 'Rounded Rectangle',\n    icon: `<rect x=\"2\" y=\"4\" width=\"11\" height=\"8\" rx=\"2.5\" ry=\"2.5\" fill=\"none\" stroke=\"#000\"/>` },\n];\n\n/* ---------- Color palette ---------- */\nconst paletteColors = [\n  // row 1\n  '#000000','#808080','#800000','#808000','#008000','#008080','#000080','#800080','#808040','#004040','#0080ff','#004080','#8000ff','#804000',\n  // row 2\n  '#ffffff','#c0c0c0','#ff0000','#ffff00','#00ff00','#00ffff','#0000ff','#ff00ff','#ffff80','#00ff80','#80ffff','#8080ff','#ff0080','#ff8040',\n];\n\n/* ---------- State ---------- */\nconst state = {\n  tool: 'pencil',\n  fg: '#000000',\n  bg: '#ffffff',\n  size: 1, // brush size index (0..3)\n  shapeStyle: 'outline', // outline | filled | both\n  isDrawing: false,\n  startX: 0, startY: 0,\n  lastX: 0, lastY: 0,\n  snapshot: null, // ImageData snapshot for previewing shapes\n  curveStage: 0,\n  curvePts: [],\n  polyPts: [],\n  undoStack: [],\n  redoStack: [],\n  textBox: null,\n};\n\nconst sizes = [1, 3, 5, 8];\nconst sprayDensity = 18;\n\n/* ---------- DOM ---------- */\nconst canvas = document.getElementById('drawCanvas');\nconst ctx = canvas.getContext('2d');\nconst overlay = document.getElementById('overlayCanvas');\nconst octx = overlay.getContext('2d');\nconst canvasFrame = document.getElementById('canvasFrame');\nconst toolGrid = document.getElementById('toolGrid');\nconst toolOptions = document.getElementById('toolOptions');\nconst paletteEl = document.getElementById('palette');\nconst ccFg = document.getElementById('ccFg');\nconst ccBg = document.getElementById('ccBg');\nconst sbHelp = document.getElementById('sbHelp');\nconst sbCoord = document.getElementById('sbCoord');\nconst sbSize = document.getElementById('sbSize');\nconst menuBar = document.getElementById('menuBar');\n\n/* ---------- Init canvas (white background) ---------- */\nfunction clearCanvas() {\n  ctx.fillStyle = '#ffffff';\n  ctx.fillRect(0, 0, canvas.width, canvas.height);\n}\nclearCanvas();\nctx.imageSmoothingEnabled = false;\noctx.imageSmoothingEnabled = false;\n\n/* ---------- Build tool grid ---------- */\ntoolDefs.forEach(t => {\n  const el = document.createElement('div');\n  el.className = 'tool outset-thin';\n  el.dataset.tool = t.id;\n  el.title = t.name;\n  el.innerHTML = `<svg class=\"pi\" viewBox=\"0 0 16 16\" shape-rendering=\"crispEdges\">${t.icon}<\u002Fsvg>`;\n  el.addEventListener('mousedown', () => setTool(t.id));\n  toolGrid.appendChild(el);\n});\n\n/* ---------- Build palette ---------- */\npaletteColors.forEach(c => {\n  const sw = document.createElement('div');\n  sw.className = 'swatch';\n  sw.style.background = c;\n  sw.title = c;\n  sw.addEventListener('mousedown', (e) => {\n    if (e.button === 2) { setBg(c); e.preventDefault(); }\n    else { setFg(c); }\n  });\n  sw.addEventListener('contextmenu', e => { e.preventDefault(); setBg(c); });\n  paletteEl.appendChild(sw);\n});\n\n/* ---------- Tool selection ---------- */\nfunction setTool(id) {\n  // cleanup pending operations\n  finishPendingOps();\n  state.tool = id;\n  document.querySelectorAll('.tool').forEach(el => {\n    el.classList.toggle('active', el.dataset.tool === id);\n  });\n  buildToolOptions();\n  updateCursor();\n  const t = toolDefs.find(t => t.id === id);\n  sbHelp.textContent = t ? `${t.name} — ` + helpFor(id) : '';\n}\n\nfunction helpFor(id) {\n  const h = {\n    'pencil':'draws a free-form line one pixel wide.',\n    'brush':'draws using a brush with the selected shape and size.',\n    'eraser':'erases a portion of the picture.',\n    'fill':'fills an area with the current drawing color.',\n    'picker':'picks up a color from the picture for drawing.',\n    'zoom':'changes the magnification.',\n    'spray':'draws using an airbrush.',\n    'text':'inserts text into the picture.',\n    'line':'draws a straight line.',\n    'curve':'draws a curved line.',\n    'rect':'draws a rectangle.',\n    'polygon':'draws a polygon.',\n    'ellipse':'draws an ellipse.',\n    'rrect':'draws a rounded rectangle.',\n    'select-rect':'selects a rectangular part of the picture.',\n    'select-free':'selects a free-form part of the picture.',\n  };\n  return h[id] || '';\n}\n\nfunction updateCursor() {\n  const map = {\n    'pencil':'crosshair',\n    'brush':'crosshair',\n    'eraser':'cell',\n    'fill':'crosshair',\n    'picker':'crosshair',\n    'zoom':'zoom-in',\n    'spray':'crosshair',\n    'text':'text',\n    'line':'crosshair',\n    'curve':'crosshair',\n    'rect':'crosshair',\n    'polygon':'crosshair',\n    'ellipse':'crosshair',\n    'rrect':'crosshair',\n    'select-rect':'crosshair',\n    'select-free':'crosshair',\n  };\n  canvas.style.cursor = map[state.tool] || 'default';\n}\n\n/* ---------- Build tool options panel ---------- */\nfunction buildToolOptions() {\n  toolOptions.innerHTML = '';\n  const t = state.tool;\n\n  // Shape style for shape tools\n  if (['rect','ellipse','rrect','polygon'].includes(t)) {\n    const styles = [\n      { id:'outline', draw:(b) => { b.style.border = '1.5px solid #000'; } },\n      { id:'both',    draw:(b) => { b.style.background = '#888'; b.style.border = '1.5px solid #000'; } },\n      { id:'filled',  draw:(b) => { b.style.background = '#000'; } },\n    ];\n    styles.forEach(s => {\n      const wrap = document.createElement('div');\n      wrap.className = 'opt-line outset-thin' + (state.shapeStyle === s.id ? ' active' : '');\n      wrap.title = s.id;\n      const shape = document.createElement('div');\n      shape.style.width = '20px'; shape.style.height='8px';\n      if (t === 'ellipse') shape.style.borderRadius = '50%';\n      if (t === 'rrect') shape.style.borderRadius = '3px';\n      s.draw(shape);\n      wrap.appendChild(shape);\n      wrap.addEventListener('mousedown', () => { state.shapeStyle = s.id; buildToolOptions(); });\n      toolOptions.appendChild(wrap);\n    });\n    return;\n  }\n\n  // Brush sizes\n  if (['brush','eraser','pencil','line','curve','spray'].includes(t)) {\n    sizes.forEach((s, i) => {\n      const wrap = document.createElement('div');\n      wrap.className = 'opt-line outset-thin' + (state.size === i ? ' active' : '');\n      const dot = document.createElement('div');\n      if (t === 'spray') {\n        // show spray density circles\n        const sz = [5,8,12,16][i];\n        dot.style.width = sz+'px';\n        dot.style.height = sz+'px';\n        dot.style.borderRadius = '50%';\n        dot.style.background = `radial-gradient(circle, #000 1px, transparent 2px) 0 0 / 3px 3px`;\n      } else if (t === 'line' || t === 'curve') {\n        const h = [1,2,3,5][i];\n        dot.style.width = '28px';\n        dot.style.height = h+'px';\n        dot.style.background = '#000';\n      } else {\n        const sz = [3,5,8,11][i];\n        dot.style.width = sz+'px';\n        dot.style.height = sz+'px';\n        dot.style.background = '#000';\n        if (t === 'eraser') {\n          dot.style.background = '#fff';\n          dot.style.border = '1px solid #000';\n        }\n      }\n      wrap.appendChild(dot);\n      wrap.addEventListener('mousedown', () => { state.size = i; buildToolOptions(); });\n      toolOptions.appendChild(wrap);\n    });\n    return;\n  }\n\n  // Selection / text / picker / zoom / fill: no options or small hint\n  if (t === 'text') {\n    const hint = document.createElement('div');\n    hint.style.fontSize = '10px';\n    hint.style.textAlign = 'center';\n    hint.style.padding = '4px 2px';\n    hint.style.color = '#000';\n    hint.textContent = 'Drag to draw a text box';\n    toolOptions.appendChild(hint);\n  }\n}\n\n/* ---------- Colors ---------- */\nfunction setFg(c) { state.fg = c; ccFg.style.background = c; }\nfunction setBg(c) { state.bg = c; ccBg.style.background = c; }\n\n/* ---------- Helpers ---------- */\nfunction getPos(e) {\n  const r = canvas.getBoundingClientRect();\n  return {\n    x: Math.floor((e.clientX - r.left) * (canvas.width / r.width)),\n    y: Math.floor((e.clientY - r.top) * (canvas.height / r.height)),\n  };\n}\nfunction brushSize() { return sizes[state.size]; }\nfunction lineWidth() { return [1,2,3,5][state.size]; }\n\nfunction pushUndo() {\n  try {\n    state.undoStack.push(ctx.getImageData(0,0,canvas.width,canvas.height));\n    if (state.undoStack.length > 20) state.undoStack.shift();\n    state.redoStack.length = 0;\n  } catch(e){}\n}\nfunction undo() {\n  if (!state.undoStack.length) return;\n  state.redoStack.push(ctx.getImageData(0,0,canvas.width,canvas.height));\n  const img = state.undoStack.pop();\n  ctx.putImageData(img, 0, 0);\n}\nfunction redo() {\n  if (!state.redoStack.length) return;\n  state.undoStack.push(ctx.getImageData(0,0,canvas.width,canvas.height));\n  const img = state.redoStack.pop();\n  ctx.putImageData(img, 0, 0);\n}\n\nfunction clearOverlay() { octx.clearRect(0,0,overlay.width,overlay.height); }\n\n/* ---------- Drawing primitives ---------- */\nfunction drawPencil(x0, y0, x1, y1) {\n  ctx.fillStyle = state.fg;\n  // Bresenham 1px\n  let dx = Math.abs(x1-x0), dy = Math.abs(y1-y0);\n  let sx = x0 < x1 ? 1 : -1, sy = y0 < y1 ? 1 : -1;\n  let err = dx - dy;\n  let x = x0, y = y0;\n  while(true) {\n    ctx.fillRect(x, y, 1, 1);\n    if (x === x1 && y === y1) break;\n    const e2 = 2*err;\n    if (e2 > -dy) { err -= dy; x += sx; }\n    if (e2 < dx) { err += dx; y += sy; }\n  }\n}\n\nfunction drawBrushStroke(x0, y0, x1, y1, color, size) {\n  ctx.fillStyle = color;\n  const r = size;\n  // simple stamped line\n  const dx = x1-x0, dy = y1-y0;\n  const dist = Math.max(Math.abs(dx), Math.abs(dy)) || 1;\n  for (let i = 0; i <= dist; i++) {\n    const t = i/dist;\n    const x = Math.round(x0 + dx*t);\n    const y = Math.round(y0 + dy*t);\n    if (r === 1) ctx.fillRect(x,y,1,1);\n    else ctx.fillRect(x - Math.floor(r/2), y - Math.floor(r/2), r, r);\n  }\n}\n\nfunction spray(x, y, color, size) {\n  ctx.fillStyle = color;\n  const radius = size/2;\n  for (let i = 0; i < sprayDensity; i++) {\n    const ang = Math.random() * Math.PI * 2;\n    const dist = Math.random() * radius;\n    const px = Math.floor(x + Math.cos(ang)*dist);\n    const py = Math.floor(y + Math.sin(ang)*dist);\n    ctx.fillRect(px, py, 1, 1);\n  }\n}\n\nfunction strokeShape(ovctx, drawFn) {\n  ovctx.strokeStyle = state.fg;\n  ovctx.fillStyle = state.bg;\n  ovctx.lineWidth = lineWidth();\n  drawFn(ovctx);\n}\n\nfunction commitShape(drawFn) {\n  pushUndo();\n  ctx.strokeStyle = state.fg;\n  ctx.fillStyle = state.bg;\n  ctx.lineWidth = lineWidth();\n  drawFn(ctx);\n}\n\nfunction drawRectOn(c, x0,y0,x1,y1, style) {\n  const x = Math.min(x0,x1), y = Math.min(y0,y1);\n  const w = Math.abs(x1-x0), h = Math.abs(y1-y0);\n  if (style !== 'outline') c.fillRect(x,y,w,h);\n  if (style !== 'filled') c.strokeRect(x+0.5,y+0.5,w-1,h-1);\n}\nfunction drawEllipseOn(c, x0,y0,x1,y1, style) {\n  const cx = (x0+x1)/2, cy = (y0+y1)/2;\n  const rx = Math.abs(x1-x0)/2, ry = Math.abs(y1-y0)/2;\n  c.beginPath();\n  c.ellipse(cx,cy,rx,ry,0,0,Math.PI*2);\n  if (style !== 'outline') c.fill();\n  if (style !== 'filled') c.stroke();\n}\nfunction drawRRectOn(c, x0,y0,x1,y1, style) {\n  const x = Math.min(x0,x1), y = Math.min(y0,y1);\n  const w = Math.abs(x1-x0), h = Math.abs(y1-y0);\n  const r = Math.min(8, w/2, h/2);\n  c.beginPath();\n  c.moveTo(x+r, y);\n  c.lineTo(x+w-r, y); c.quadraticCurveTo(x+w, y, x+w, y+r);\n  c.lineTo(x+w, y+h-r); c.quadraticCurveTo(x+w, y+h, x+w-r, y+h);\n  c.lineTo(x+r, y+h); c.quadraticCurveTo(x, y+h, x, y+h-r);\n  c.lineTo(x, y+r); c.quadraticCurveTo(x, y, x+r, y);\n  c.closePath();\n  if (style !== 'outline') c.fill();\n  if (style !== 'filled') c.stroke();\n}\nfunction drawLineOn(c, x0,y0,x1,y1) {\n  c.beginPath();\n  c.moveTo(x0+0.5, y0+0.5);\n  c.lineTo(x1+0.5, y1+0.5);\n  c.stroke();\n}\n\n/* ---------- Flood fill ---------- */\nfunction floodFill(x, y, fillColor) {\n  pushUndo();\n  const w = canvas.width, h = canvas.height;\n  const img = ctx.getImageData(0,0,w,h);\n  const data = img.data;\n  const target = [data[(y*w+x)*4], data[(y*w+x)*4+1], data[(y*w+x)*4+2], data[(y*w+x)*4+3]];\n  const fill = hexToRgba(fillColor);\n  if (target[0]===fill[0]&&target[1]===fill[1]&&target[2]===fill[2]&&target[3]===fill[3]) return;\n  const stack = [[x,y]];\n  while (stack.length) {\n    const [cx,cy] = stack.pop();\n    if (cx<0||cy<0||cx>=w||cy>=h) continue;\n    const i = (cy*w+cx)*4;\n    if (data[i]!==target[0]||data[i+1]!==target[1]||data[i+2]!==target[2]||data[i+3]!==target[3]) continue;\n    data[i]=fill[0]; data[i+1]=fill[1]; data[i+2]=fill[2]; data[i+3]=fill[3];\n    stack.push([cx+1,cy],[cx-1,cy],[cx,cy+1],[cx,cy-1]);\n  }\n  ctx.putImageData(img,0,0);\n}\nfunction hexToRgba(hex) {\n  const h = hex.replace('#','');\n  return [parseInt(h.slice(0,2),16), parseInt(h.slice(2,4),16), parseInt(h.slice(4,6),16), 255];\n}\nfunction rgbaAt(x,y) {\n  const d = ctx.getImageData(x,y,1,1).data;\n  return '#' + [d[0],d[1],d[2]].map(v => v.toString(16).padStart(2,'0')).join('');\n}\n\n/* ---------- Mouse handlers on canvas ---------- */\ncanvas.addEventListener('mousedown', (e) => {\n  const p = getPos(e);\n  const right = e.button === 2;\n  const color = right ? state.bg : state.fg;\n  state.startX = p.x; state.startY = p.y;\n  state.lastX = p.x; state.lastY = p.y;\n  state.isDrawing = true;\n\n  switch(state.tool) {\n    case 'pencil':\n      pushUndo();\n      ctx.fillStyle = color;\n      ctx.fillRect(p.x, p.y, 1, 1);\n      break;\n    case 'brush':\n      pushUndo();\n      drawBrushStroke(p.x,p.y,p.x,p.y, color, brushSize());\n      break;\n    case 'eraser':\n      pushUndo();\n      drawBrushStroke(p.x,p.y,p.x,p.y, state.bg, brushSize()+2);\n      break;\n    case 'fill':\n      floodFill(p.x, p.y, color);\n      state.isDrawing = false;\n      break;\n    case 'picker':\n      const c = rgbaAt(p.x, p.y);\n      if (right) setBg(c); else setFg(c);\n      state.isDrawing = false;\n      break;\n    case 'spray':\n      pushUndo();\n      spray(p.x,p.y,color,[8,14,22,30][state.size]);\n      break;\n    case 'zoom':\n      // toggle zoom factor on the canvas frame visually\n      const cur = parseFloat(canvas.style.transform?.match(/scale\\(([\\d.]+)\\)/)?.[1] || '1');\n      const next = cur >= 4 ? 1 : cur*2;\n      canvas.style.transformOrigin = '0 0';\n      overlay.style.transformOrigin = '0 0';\n      canvas.style.transform = `scale(${next})`;\n      overlay.style.transform = `scale(${next})`;\n      canvasFrame.style.width = (canvas.width * next) + 'px';\n      canvasFrame.style.height = (canvas.height * next) + 'px';\n      state.isDrawing = false;\n      break;\n    case 'text':\n      state.snapshot = ctx.getImageData(0,0,canvas.width,canvas.height);\n      break;\n    case 'line': case 'rect': case 'ellipse': case 'rrect':\n      state.snapshot = ctx.getImageData(0,0,canvas.width,canvas.height);\n      break;\n    case 'curve':\n      // multi-stage: click-drag for endpoints, then 2 clicks for control points\n      if (state.curveStage === 0) {\n        state.curvePts = [[p.x,p.y]];\n        state.snapshot = ctx.getImageData(0,0,canvas.width,canvas.height);\n      }\n      break;\n    case 'polygon':\n      if (!state.polyPts.length) {\n        state.snapshot = ctx.getImageData(0,0,canvas.width,canvas.height);\n        state.polyPts = [[p.x,p.y]];\n      }\n      break;\n    case 'select-rect':\n      state.snapshot = ctx.getImageData(0,0,canvas.width,canvas.height);\n      break;\n  }\n});\n\ncanvas.addEventListener('mousemove', (e) => {\n  const p = getPos(e);\n  sbCoord.textContent = `${p.x},${p.y}`;\n  if (!state.isDrawing) {\n    // polygon/curve preview\n    if (state.tool === 'polygon' && state.polyPts.length) {\n      previewPolygon(p);\n    }\n    return;\n  }\n  const right = e.buttons === 2;\n  const color = right ? state.bg : state.fg;\n\n  switch(state.tool) {\n    case 'pencil':\n      drawPencil(state.lastX, state.lastY, p.x, p.y);\n      break;\n    case 'brush':\n      drawBrushStroke(state.lastX, state.lastY, p.x, p.y, color, brushSize());\n      break;\n    case 'eraser':\n      drawBrushStroke(state.lastX, state.lastY, p.x, p.y, state.bg, brushSize()+2);\n      break;\n    case 'spray':\n      spray(p.x, p.y, color, [8,14,22,30][state.size]);\n      break;\n    case 'line':\n      ctx.putImageData(state.snapshot, 0,0);\n      ctx.strokeStyle = color; ctx.lineWidth = lineWidth();\n      drawLineOn(ctx, state.startX, state.startY, p.x, p.y);\n      break;\n    case 'rect':\n      ctx.putImageData(state.snapshot, 0,0);\n      ctx.strokeStyle = state.fg; ctx.fillStyle = state.bg; ctx.lineWidth = lineWidth();\n      drawRectOn(ctx, state.startX, state.startY, p.x, p.y, state.shapeStyle);\n      break;\n    case 'ellipse':\n      ctx.putImageData(state.snapshot, 0,0);\n      ctx.strokeStyle = state.fg; ctx.fillStyle = state.bg; ctx.lineWidth = lineWidth();\n      drawEllipseOn(ctx, state.startX, state.startY, p.x, p.y, state.shapeStyle);\n      break;\n    case 'rrect':\n      ctx.putImageData(state.snapshot, 0,0);\n      ctx.strokeStyle = state.fg; ctx.fillStyle = state.bg; ctx.lineWidth = lineWidth();\n      drawRRectOn(ctx, state.startX, state.startY, p.x, p.y, state.shapeStyle);\n      break;\n    case 'select-rect':\n      ctx.putImageData(state.snapshot, 0,0);\n      drawSelectionRect(state.startX, state.startY, p.x, p.y);\n      break;\n  }\n  state.lastX = p.x; state.lastY = p.y;\n});\n\nfunction previewPolygon(p) {\n  ctx.putImageData(state.snapshot, 0, 0);\n  if (state.polyPts.length < 1) return;\n  ctx.strokeStyle = state.fg; ctx.lineWidth = lineWidth();\n  ctx.beginPath();\n  ctx.moveTo(state.polyPts[0][0]+0.5, state.polyPts[0][1]+0.5);\n  for (let i = 1; i < state.polyPts.length; i++) ctx.lineTo(state.polyPts[i][0]+0.5, state.polyPts[i][1]+0.5);\n  ctx.lineTo(p.x+0.5, p.y+0.5);\n  ctx.stroke();\n}\n\nfunction drawSelectionRect(x0,y0,x1,y1) {\n  const x = Math.min(x0,x1), y = Math.min(y0,y1);\n  const w = Math.abs(x1-x0), h = Math.abs(y1-y0);\n  ctx.save();\n  ctx.strokeStyle = '#000';\n  ctx.setLineDash([3,3]);\n  ctx.lineWidth = 1;\n  ctx.strokeRect(x+0.5, y+0.5, w, h);\n  ctx.restore();\n}\n\ncanvas.addEventListener('mouseup', (e) => {\n  if (!state.isDrawing) {\n    // handle polygon clicks even without drag\n    if (state.tool === 'polygon') {\n      const p = getPos(e);\n      state.polyPts.push([p.x, p.y]);\n    }\n    return;\n  }\n  const p = getPos(e);\n  state.isDrawing = false;\n\n  if (state.tool === 'text') {\n    createTextBox(state.startX, state.startY, p.x, p.y);\n  } else if (state.tool === 'polygon') {\n    state.polyPts.push([p.x, p.y]);\n  } else if (state.tool === 'curve') {\n    if (state.curveStage === 0) {\n      state.curvePts.push([p.x, p.y]);\n      state.curveStage = 1;\n      state.snapshot = ctx.getImageData(0,0,canvas.width,canvas.height);\n      pushUndo();\n      // draw straight line as starting curve\n      ctx.strokeStyle = state.fg; ctx.lineWidth = lineWidth();\n      drawLineOn(ctx, state.curvePts[0][0], state.curvePts[0][1], state.curvePts[1][0], state.curvePts[1][1]);\n    } else if (state.curveStage === 1) {\n      state.curvePts.push([p.x, p.y]);\n      state.curveStage = 2;\n    } else if (state.curveStage === 2) {\n      state.curvePts.push([p.x, p.y]);\n      // draw final curve\n      ctx.putImageData(state.snapshot,0,0);\n      const [p0,p1,c1,c2] = state.curvePts;\n      ctx.strokeStyle = state.fg; ctx.lineWidth = lineWidth();\n      ctx.beginPath();\n      ctx.moveTo(p0[0]+0.5, p0[1]+0.5);\n      ctx.bezierCurveTo(c1[0],c1[1], c2[0],c2[1], p1[0]+0.5,p1[1]+0.5);\n      ctx.stroke();\n      state.curvePts = []; state.curveStage = 0;\n    }\n  }\n});\n\n// polygon double-click closes\ncanvas.addEventListener('dblclick', (e) => {\n  if (state.tool === 'polygon' && state.polyPts.length >= 2) {\n    const p = getPos(e);\n    ctx.putImageData(state.snapshot, 0, 0);\n    ctx.strokeStyle = state.fg; ctx.fillStyle = state.bg; ctx.lineWidth = lineWidth();\n    ctx.beginPath();\n    ctx.moveTo(state.polyPts[0][0]+0.5, state.polyPts[0][1]+0.5);\n    for (let i = 1; i < state.polyPts.length; i++) ctx.lineTo(state.polyPts[i][0]+0.5, state.polyPts[i][1]+0.5);\n    ctx.lineTo(p.x+0.5, p.y+0.5);\n    ctx.closePath();\n    if (state.shapeStyle !== 'outline') ctx.fill();\n    if (state.shapeStyle !== 'filled') ctx.stroke();\n    state.polyPts = [];\n  }\n});\n\ncanvas.addEventListener('contextmenu', e => e.preventDefault());\ncanvas.addEventListener('mouseleave', () => { sbCoord.textContent = ''; });\n\n/* ---------- Text tool ---------- */\nfunction createTextBox(x0,y0,x1,y1) {\n  if (state.textBox) state.textBox.remove();\n  const x = Math.min(x0,x1), y = Math.min(y0,y1);\n  const w = Math.max(60, Math.abs(x1-x0));\n  const h = Math.max(20, Math.abs(y1-y0));\n  const ta = document.createElement('textarea');\n  ta.className = 'text-edit';\n  ta.style.left = x + 'px';\n  ta.style.top = y + 'px';\n  ta.style.width = w + 'px';\n  ta.style.height = h + 'px';\n  ta.style.color = state.fg;\n  canvasFrame.appendChild(ta);\n  ta.focus();\n  state.textBox = ta;\n  ta.addEventListener('blur', commitText);\n}\nfunction commitText() {\n  const ta = state.textBox;\n  if (!ta) return;\n  const txt = ta.value;\n  if (txt) {\n    pushUndo();\n    const x = parseFloat(ta.style.left);\n    const y = parseFloat(ta.style.top);\n    const w = parseFloat(ta.style.width);\n    ctx.fillStyle = state.fg;\n    ctx.font = '14px \"MS Sans Serif\", Tahoma, sans-serif';\n    ctx.textBaseline = 'top';\n    // wrap text manually\n    const lines = txt.split('\\n');\n    let yy = y + 4;\n    lines.forEach(line => {\n      const words = line.split(' ');\n      let row = '';\n      words.forEach(word => {\n        const test = row ? row + ' ' + word : word;\n        if (ctx.measureText(test).width > w - 8) {\n          ctx.fillText(row, x+4, yy);\n          yy += 16;\n          row = word;\n        } else row = test;\n      });\n      ctx.fillText(row, x+4, yy);\n      yy += 16;\n    });\n  }\n  ta.remove();\n  state.textBox = null;\n}\n\n/* ---------- Finish pending multi-step ops ---------- */\nfunction finishPendingOps() {\n  if (state.textBox) commitText();\n  if (state.polyPts.length) state.polyPts = [];\n  if (state.curveStage) { state.curveStage = 0; state.curvePts = []; }\n}\n\n/* ---------- Menus ---------- */\nlet openMenu = null;\ndocument.querySelectorAll('.menu-item').forEach(m => {\n  m.addEventListener('mousedown', (e) => {\n    if (e.target.closest('.dropdown')) return;\n    if (m.classList.contains('open')) {\n      m.classList.remove('open'); openMenu = null;\n    } else {\n      document.querySelectorAll('.menu-item.open').forEach(x => x.classList.remove('open'));\n      m.classList.add('open'); openMenu = m;\n    }\n    e.preventDefault();\n  });\n  m.addEventListener('mouseenter', () => {\n    if (openMenu && openMenu !== m) {\n      openMenu.classList.remove('open');\n      m.classList.add('open'); openMenu = m;\n    }\n  });\n});\ndocument.addEventListener('mousedown', (e) => {\n  if (!e.target.closest('.menu-item')) {\n    document.querySelectorAll('.menu-item.open').forEach(x => x.classList.remove('open'));\n    openMenu = null;\n  }\n});\n\n/* Menu actions */\ndocument.querySelectorAll('.dd-item').forEach(it => {\n  it.addEventListener('mousedown', (e) => {\n    if (it.classList.contains('disabled')) return;\n    const action = it.dataset.action;\n    runAction(action);\n    document.querySelectorAll('.menu-item.open').forEach(x => x.classList.remove('open'));\n    openMenu = null;\n    e.stopPropagation();\n  });\n});\n\nfunction runAction(a) {\n  switch(a) {\n    case 'new': case 'clearImage':\n      if (confirm('Save changes? OK = no, just clear.')) { pushUndo(); clearCanvas(); }\n      break;\n    case 'undo': undo(); break;\n    case 'redo': redo(); break;\n    case 'selectAll': setTool('select-rect'); break;\n    case 'clear': pushUndo(); clearCanvas(); break;\n    case 'flipH': {\n      pushUndo();\n      const tmp = document.createElement('canvas');\n      tmp.width = canvas.width; tmp.height = canvas.height;\n      tmp.getContext('2d').drawImage(canvas, 0,0);\n      ctx.save();\n      ctx.translate(canvas.width, 0); ctx.scale(-1, 1);\n      ctx.drawImage(tmp, 0, 0);\n      ctx.restore();\n      break;\n    }\n    case 'flipV': {\n      pushUndo();\n      const tmp = document.createElement('canvas');\n      tmp.width = canvas.width; tmp.height = canvas.height;\n      tmp.getContext('2d').drawImage(canvas, 0,0);\n      ctx.save();\n      ctx.translate(0, canvas.height); ctx.scale(1, -1);\n      ctx.drawImage(tmp, 0, 0);\n      ctx.restore();\n      break;\n    }\n    case 'invert': {\n      pushUndo();\n      const img = ctx.getImageData(0,0,canvas.width,canvas.height);\n      for (let i=0; i<img.data.length; i+=4) {\n        img.data[i] = 255-img.data[i];\n        img.data[i+1] = 255-img.data[i+1];\n        img.data[i+2] = 255-img.data[i+2];\n      }\n      ctx.putImageData(img,0,0);\n      break;\n    }\n    case 'save': {\n      const a = document.createElement('a');\n      a.download = 'untitled.png';\n      a.href = canvas.toDataURL('image/png');\n      a.click();\n      break;\n    }\n    case 'attributes': {\n      const w = prompt('Width:', canvas.width);\n      const h = prompt('Height:', canvas.height);\n      if (w && h) resizeCanvas(parseInt(w), parseInt(h));\n      break;\n    }\n    case 'about':\n      document.getElementById('aboutModal').classList.add('open');\n      break;\n    case 'camera':\n      openCameraModal();\n      break;\n  }\n}\n\n/* ---------- Camera capture ---------- */\nconst camModal = document.getElementById('cameraModal');\nconst camVideo = document.getElementById('camVideo');\nconst camPreview = document.getElementById('camPreview');\nconst camStatus = document.getElementById('camStatus');\nconst camFlash = document.getElementById('camFlash');\nconst camRecDot = document.getElementById('camRecDot');\nconst camStartBtn = document.getElementById('camStartBtn');\nconst camSnapBtn = document.getElementById('camSnapBtn');\nconst camRetakeBtn = document.getElementById('camRetakeBtn');\nconst camInsertBtn = document.getElementById('camInsertBtn');\nconst camCancelBtn = document.getElementById('camCancelBtn');\nconst camDither = document.getElementById('camDither');\nconst camGray = document.getElementById('camGray');\nlet camStream = null;\nlet camHasShot = false;\nlet camRecBlink = null;\n\nfunction openCameraModal() {\n  camModal.classList.add('open');\n  camHasShot = false;\n  camPreview.style.display = 'none';\n  camVideo.style.display = 'block';\n  camSnapBtn.style.display = 'inline-flex';\n  camRetakeBtn.style.display = 'none';\n  camInsertBtn.style.display = 'none';\n  if (!camStream) {\n    camStatus.style.display = 'flex';\n    camStartBtn.style.display = 'inline-flex';\n  } else {\n    camStatus.style.display = 'none';\n    camStartBtn.style.display = 'none';\n  }\n}\n\nfunction closeCameraModal() {\n  camModal.classList.remove('open');\n  if (camStream) {\n    camStream.getTracks().forEach(t => t.stop());\n    camStream = null;\n  }\n  if (camRecBlink) { clearInterval(camRecBlink); camRecBlink = null; camRecDot.textContent = ''; }\n}\n\nasync function startCamera() {\n  camStatus.textContent = 'Requesting camera...';\n  try {\n    camStream = await navigator.mediaDevices.getUserMedia({ video: { width: 320, height: 240 }, audio: false });\n    camVideo.srcObject = camStream;\n    camStatus.style.display = 'none';\n    camStartBtn.style.display = 'none';\n    // blinking REC dot\n    let on = true;\n    camRecBlink = setInterval(() => {\n      camRecDot.textContent = on ? '\\u25CF REC' : '';\n      on = !on;\n    }, 600);\n  } catch (err) {\n    camStatus.innerHTML = 'Camera unavailable.<br>' + (err.message || err.name);\n    camStatus.style.color = '#ff8080';\n  }\n}\n\nfunction snapPhoto() {\n  if (!camStream) return;\n  // flash effect\n  camFlash.style.transition = 'none';\n  camFlash.style.opacity = '1';\n  setTimeout(() => { camFlash.style.transition = 'opacity 400ms'; camFlash.style.opacity = '0'; }, 30);\n\n  const pctx = camPreview.getContext('2d');\n  pctx.drawImage(camVideo, 0, 0, camPreview.width, camPreview.height);\n  applyCamEffects(pctx);\n  camPreview.style.display = 'block';\n  camVideo.style.display = 'none';\n  camSnapBtn.style.display = 'none';\n  camRetakeBtn.style.display = 'inline-flex';\n  camInsertBtn.style.display = 'inline-flex';\n  camHasShot = true;\n}\n\nfunction applyCamEffects(pctx) {\n  if (!camGray.checked && !camDither.checked) return;\n  const img = pctx.getImageData(0,0,camPreview.width, camPreview.height);\n  const d = img.data;\n  const w = camPreview.width, h = camPreview.height;\n  // grayscale\n  for (let i = 0; i < d.length; i += 4) {\n    const g = 0.299*d[i] + 0.587*d[i+1] + 0.114*d[i+2];\n    d[i] = d[i+1] = d[i+2] = g;\n  }\n  if (camDither.checked) {\n    // Floyd-Steinberg dither to 1-bit\n    const buf = new Float32Array(w*h);\n    for (let y=0; y<h; y++) for (let x=0; x<w; x++) buf[y*w+x] = d[(y*w+x)*4];\n    for (let y=0; y<h; y++) {\n      for (let x=0; x<w; x++) {\n        const old = buf[y*w+x];\n        const ne = old < 128 ? 0 : 255;\n        buf[y*w+x] = ne;\n        const err = old - ne;\n        if (x+1<w) buf[y*w+x+1] += err*7/16;\n        if (y+1<h) {\n          if (x>0) buf[(y+1)*w+x-1] += err*3/16;\n          buf[(y+1)*w+x] += err*5/16;\n          if (x+1<w) buf[(y+1)*w+x+1] += err*1/16;\n        }\n      }\n    }\n    for (let i = 0; i < w*h; i++) {\n      d[i*4] = d[i*4+1] = d[i*4+2] = buf[i];\n    }\n  }\n  pctx.putImageData(img,0,0);\n}\n\nfunction retake() {\n  camPreview.style.display = 'none';\n  camVideo.style.display = 'block';\n  camSnapBtn.style.display = 'inline-flex';\n  camRetakeBtn.style.display = 'none';\n  camInsertBtn.style.display = 'none';\n  camHasShot = false;\n}\n\nfunction insertPhoto() {\n  if (!camHasShot) return;\n  pushUndo();\n  // fit centered into canvas, preserving aspect, max 70% of canvas\n  const cw = canvas.width, ch = canvas.height;\n  const maxW = cw * 0.75, maxH = ch * 0.75;\n  const ratio = Math.min(maxW / camPreview.width, maxH / camPreview.height);\n  const w = Math.round(camPreview.width * ratio);\n  const h = Math.round(camPreview.height * ratio);\n  const x = Math.round((cw - w) / 2);\n  const y = Math.round((ch - h) / 2);\n  ctx.imageSmoothingEnabled = false;\n  ctx.drawImage(camPreview, x, y, w, h);\n  closeCameraModal();\n}\n\ncamStartBtn.addEventListener('mousedown', startCamera);\ncamSnapBtn.addEventListener('mousedown', snapPhoto);\ncamRetakeBtn.addEventListener('mousedown', retake);\ncamInsertBtn.addEventListener('mousedown', insertPhoto);\ncamCancelBtn.addEventListener('mousedown', closeCameraModal);\ndocument.getElementById('closeCamera').addEventListener('mousedown', closeCameraModal);\n\ndocument.getElementById('closeAbout').addEventListener('mousedown', () => document.getElementById('aboutModal').classList.remove('open'));\ndocument.getElementById('closeAboutOk').addEventListener('mousedown', () => document.getElementById('aboutModal').classList.remove('open'));\n\n/* ---------- Resize canvas ---------- */\nfunction resizeCanvas(w, h) {\n  const tmp = document.createElement('canvas');\n  tmp.width = canvas.width; tmp.height = canvas.height;\n  tmp.getContext('2d').drawImage(canvas, 0, 0);\n  canvas.width = w; canvas.height = h;\n  overlay.width = w; overlay.height = h;\n  clearCanvas();\n  ctx.drawImage(tmp, 0, 0);\n  sbSize.textContent = `${w} x ${h}`;\n}\n\n/* Resize handles */\nlet resizing = null;\ndocument.querySelectorAll('.resize-handle').forEach(h => {\n  h.addEventListener('mousedown', (e) => {\n    resizing = { dir: h.dataset.rh, startX: e.clientX, startY: e.clientY, w: canvas.width, h: canvas.height };\n    e.preventDefault();\n    e.stopPropagation();\n  });\n});\ndocument.addEventListener('mousemove', (e) => {\n  if (!resizing) return;\n  let nw = resizing.w, nh = resizing.h;\n  if (resizing.dir.includes('e')) nw = Math.max(50, resizing.w + (e.clientX - resizing.startX));\n  if (resizing.dir.includes('s')) nh = Math.max(50, resizing.h + (e.clientY - resizing.startY));\n  sbSize.textContent = `${nw} x ${nh}`;\n  canvasFrame.style.width = nw + 'px';\n  canvasFrame.style.height = nh + 'px';\n});\ndocument.addEventListener('mouseup', (e) => {\n  if (resizing) {\n    let nw = resizing.w, nh = resizing.h;\n    if (resizing.dir.includes('e')) nw = Math.max(50, resizing.w + (e.clientX - resizing.startX));\n    if (resizing.dir.includes('s')) nh = Math.max(50, resizing.h + (e.clientY - resizing.startY));\n    resizeCanvas(nw, nh);\n    canvasFrame.style.width = ''; canvasFrame.style.height = '';\n    resizing = null;\n  }\n});\n\n/* ---------- Keyboard ---------- */\ndocument.addEventListener('keydown', (e) => {\n  if (state.textBox && document.activeElement === state.textBox) return;\n  if (e.ctrlKey || e.metaKey) {\n    if (e.key === 'z') { e.preventDefault(); undo(); }\n    else if (e.key === 'y') { e.preventDefault(); redo(); }\n    else if (e.key === 'n') { e.preventDefault(); clearCanvas(); }\n    else if (e.key === 's') { e.preventDefault(); runAction('save'); }\n    else if (e.key === 'i') { e.preventDefault(); runAction('invert'); }\n    else if (e.key === 'm') { e.preventDefault(); runAction('camera'); }\n  } else if (e.key === 'Escape') {\n    finishPendingOps();\n  }\n});\n\n/* ---------- Init ---------- */\nsetTool('pencil');\nsetFg('#0000 '.ABBA...',\n  'AABA....',\n  'AAA.....',\n  'A.......',\n], { A:'#000', B:'#fbbf24' });\n\n/* Pencil */\nconst pencilSticker = pxArt([\n  '......AA',\n  '.....ABA',\n  '....ACCA',\n  '...ACCA.',\n  '..ACCA..',\n  '.ACCA...',\n  '.DCA....',\n  '.DA.....',\n  'A.......',\n], { A:'#000', B:'#9ca3af', C:'#fcd34d', D:'#7c2d12' });\n\n/* Eraser */\nconst eraserSticker = pxArt([\n  '...AAAAA',\n  '..ABBBBA',\n  '.ABBBBBA',\n  'AAAAAABA'.slice(0,8),\n  'APPPPPAA'.slice(0,8),\n  'APPPPPA.',\n  'APPPPPA.',\n  'AAAAAA..',\n], { A:'#000', B:'#dbeafe', P:'#f9a8d4' });\n\n/* Ruler */\nconst ruler = pxArt([\n  'AAAAAAAA',\n  'AYYYYYYA',\n  'AYAYAYAA',\n  'AYYYYYYA',\n  'AAAAAAAA',\n], { A:'#000', Y:'#fde047' });\n\n/* Paint bucket */\nconst paintBucket = pxArt([\n  '..AAAA..',\n  '.A....A.',\n  'A.RRRR.A',\n  'A.RBBR.A',\n  'A.RBBR.A',\n  'A.BBBB.A',\n  '.AYBBYA.',\n  '..AAAA..',\n], { A:'#000', R:'#dc2626', B:'#1d4ed8', Y:'#fbbf24' });\n\n/* Marker */\nconst marker = pxArt([\n  '..AAAA..',\n  '.AGGGGA.',\n  '.AGGGGA.',\n  '.AOOOOA.',\n  '.AOOOOA.',\n  '.A....A.',\n  '.A.PP.A.',\n  '..APPA..',\n  '...AA...',\n], { A:'#000', G:'#6b7280', O:'#fbbf24', P:'#ec4899' });\n\n/* 90s pixel characters (original, not branded) */\nconst pixRobot = pxArt([\n  '..AAAA..',\n  '.A.AA.A.',\n  '.AAAAAA.',\n  '.ABABBA.',\n  '.AAAAAA.',\n  'AAAAAAAA',\n  'A.AAAA.A',\n  '..AA.AA.',\n], { A:'#6b7280', B:'#ef4444' });\n\nconst pixAlien = pxArt([\n  '..AAAA..',\n  '.AGGGGA.',\n  'AGGGGGGA',\n  'AGKGGKGA',\n  'AGGGGGGA',\n  '.AGGGGA.',\n  '.A.AA.A.',\n  '.A....A.',\n], { A:'#000', G:'#22c55e', K:'#000' });\n\nconst pixMonster = pxArt([\n  '.A....A.',\n  '.AAAAAA.',\n  'APAPPAPA'.slice(0,8),\n  'AKAAAAKA',\n  'AAAAAAAA',\n  'AAWAAWAA'.slice(0,8),\n  '.AAAAAA.',\n  '.A.AA.A.',\n], { A:'#a855f7', P:'#fde047', K:'#000', W:'#fff' });\n\nconst pixNinja = pxArt([\n  '..AAAA..',\n  '.AAAAAA.',\n  'AAAAAAAA',\n  'WWWWWWWW',\n  'WWKWWKWW',\n  'WWWWWWWW',\n  '.AAAAAA.',\n  '.A....A.',\n], { A:'#111', W:'#1f2937', K:'#fff' });\n\nconst pixHero = pxArt([\n  '..AAAA..',\n  '.AYYYYA.',\n  'AYBBBBYA',\n  'AYBKBKBYA'.slice(0,8),\n  'AYBBBBYA',\n  '.AYRRYA.',\n  '.A.YY.A.',\n  '.A....A.',\n], { A:'#000', Y:'#fcd34d', B:'#fde68a', K:'#000', R:'#dc2626' });\n\nconst pixWizard = pxArt([\n  '...AB...',\n  '..ABBB..',\n  '.ABBBBA.',\n  '..AYYA..',\n  '.AYKYKYA',\n  '.AYYYYYA',\n  '.AYWWYY.',\n  '.AAAAAA.',\n], { A:'#000', B:'#7c3aed', Y:'#fcd34d', K:'#000', W:'#fff' });\n\n/* TV / CRT — 90s tech */\nconst crtTV = pxArt([\n  'AAAAAAAA',\n  'ABBBBBBA',\n  'ABCCCCBA',\n  'ABCCCCBA',\n  'ABBBBBBA',\n  'AAAAAAAA',\n  'A.A..A.A',\n  'AA....AA',\n], { A:'#1f2937', B:'#9ca3af', C:'#60a5fa' });\n\n/* Game controller */\nconst controller = pxArt([\n  '.AAAAAAAA.',\n  'AGGGGGGGGA',\n  'AGKGAGGRGA',\n  'AGGGGGGRGA',\n  'AGKGAGGGGA',\n  '.AAAAAAAA.',\n], { A:'#000', G:'#6b7280', K:'#374151', R:'#dc2626' });\n\n/* CD */\nconst cdDisc = pxArt([\n  '..AAAA..',\n  '.ACCCCA.',\n  'ACCWWCCA',\n  'ACWAAWCA',\n  'ACWAAWCA',\n  'ACCWWCCA',\n  '.ACCCCA.',\n  '..AAAA..',\n], { A:'#000', C:'#a5f3fc', W:'#fff' });\n\n/* Game cart */\nconst gameCart = pxArt([\n  'AAAAAAAA',\n  'ABBBBBBA',\n  'ABWWWWBA',\n  'ABWLLWBA',\n  'ABWWWWBA',\n  'ABBBBBBA',\n  'A.AAAA.A',\n  'A.A..A.A',\n], { A:'#000', B:'#6b7280', W:'#1f2937', L:'#fbbf24' });\n\n/* Beeper / pager */\nconst beeper = pxArt([\n  '.AAAAAA.',\n  'AGGGGGGA',\n  'AGWWWWGA',\n  'AGW88WGA',\n  'AGWWWWGA',\n  'AGGGGGGA',\n  'AGOOOGGA',\n  '.AAAAAA.',\n], { A:'#000', G:'#374151', W:'#86efac', '8':'#000', O:'#9ca3af' });\n\n/* ---------- Sticker categories ---------- */\n/* Each sticker is { e: emoji } or { s: svgString } */\nconst E = (e) => ({ e });\nconst S = (s) => ({ s });\n\nconst stickerCategories = [\n  {\n    id: 'cats', name: 'Cats',\n    catIcon: S(catOrange),\n    stickers: [\n      S(catOrange), S(catGray), S(catBlack), S(catWhite),\n      E('🐱'), E('😺'), E('😸'), E('😹'),\n      E('😻'), E('😼'), E('😽'), E('🙀'),\n      E('😿'), E('😾'), E('🐈'), E('🐾'),\n    ]\n  },\n  {\n    id: 'dogs', name: 'Dogs',\n    catIcon: E('🐶'),\n    stickers: [\n      E('🐶'), E('🐕'), E('🐩'), E('🐺'),\n      E('🦮'), E('🐕‍🦺'), E('🦴'), E('🐾'),\n    ]\n  },\n  {\n    id: 'ghosts', name: 'Ghosts',\n    catIcon: S(ghostClassic),\n    stickers: [\n      S(ghostClassic),\n      E('👻'), E('💀'), E('☠️'),\n      E('🎃'), E('👽'), E('👾'), E('🤡'),\n      E('🧟'), E('🧛'), E('🧙'), E('🕸️'),\n    ]\n  },\n  {\n    id: 'design', name: 'Design',\n    catIcon: S(cursorArrow),\n    stickers: [\n      S(cursorArrow), S(paletteIcon), S(pixelGrid),\n      S(wireframe), S(penTool),\n      E('🎨'), E('🖌️'), E('📐'),\n      E('💡'), E('📱'), E('💻'), E('🖥️'),\n    ]\n  },\n  {\n    id: 'pencils', name: 'Pencils',\n    catIcon: S(pencilSticker),\n    stickers: [\n      S(pencilSticker), S(eraserSticker), S(ruler),\n      S(paintBucket), S(marker),\n      E('✏️'), E('🖊️'), E('🖋️'),\n      E('🖌️'), E('🖍️'), E('📏'), E('✂️'),\n    ]\n  },\n  {\n    id: '90s', name: '90s Things',\n    catIcon: S(floppy),\n    stickers: [\n      S(floppy), S(cassette), S(pxHeart),\n      E('💾'), E('📼'), E('💿'), E('📀'),\n      E('⭐'), E('☀️'), E('🌈'), E('🍭'),\n      E('🎀'), E('🎵'), E('📞'), E('☎️'),\n    ]\n  },\n  {\n    id: '90chars', name: '90s Chars',\n    catIcon: S(pixMonster),\n    stickers: [\n      S(pixRobot), S(pixAlien), S(pixMonster),\n      S(pixNinja), S(pixHero), S(pixWizard),\n      E('🤖'), E('👾'), E('🦸'), E('🦹'),\n      E('🧙'), E('🐉'),\n    ]\n  },\n  {\n    id: '90tech', name: '90s Tech',\n    catIcon: S(crtTV),\n    stickers: [\n      S(crtTV), S(controller), S(cdDisc), S(gameCart), S(beeper),\n      E('📺'), E('📻'), E('🎮'),\n      E('🕹️'), E('📠'), E('💽'), E('🖨️'),\n    ]\n  },\n  {\n    id: 'hearts', name: 'Hearts',\n    catIcon: S(pxHeart),\n    stickers: [\n      S(pxHeart),\n      E('❤️'), E('🧡'), E('💛'), E('💚'),\n      E('💙'), E('💜'), E('🖤'), E('🤍'),\n      E('💖'), E('💗'), E('💕'), E('💘'),\n      E('💝'), E('💟'),\n    ]\n  },\n  {\n    id: 'food', name: 'Food',\n    catIcon: E('🍔'),\n    stickers: [\n      E('🍔'), E('🍟'), E('🍕'), E('🌭'),\n      E('🍿'), E('🍩'), E('🍪'), E('🍰'),\n      E('🍦'), E('🍭'), E('🍫'), E('🥤'),\n      E('🍎'), E('🍌'), E('🍓'), E('🥑'),\n    ]\n  },\n  {\n    id: 'misc', name: 'Misc',\n    catIcon: E('⭐'),\n    stickers: [\n      E('⭐'), E('🌟'), E('✨'), E('💫'),\n      E('🎉'), E('🎊'), E('🎁'), E('🎈'),\n      E('🌈'), E('☀️'), E('🌙'), E('☁️'),\n      E('🔥'), E('💥'), E('💯'), E('❓'),\n    ]\n  },\n];\n\n/* ---------- Sticker state ---------- */\nconst stickerState = {\n  activeCatId: 'cats',\n  selectedIdx: -1,         // index inside current category\n  selectedSticker: null,   // sticker object to be placed\n  placing: false,          // canvas placement mode\n};\n\n/* ---------- DOM refs ---------- */\nconst stickerModal = document.getElementById('stickerModal');\nconst stickerCatsEl = document.getElementById('stickerCats');\nconst stickerGridEl = document.getElementById('stickerGrid');\nconst stickerCatNameEl = document.getElementById('stickerCatName');\nconst stickerBtn = document.getElementById('stickerBtn');\nconst stickerInsertBtn = document.getElementById('stickerInsertBtn');\nconst stickerCancelBtn = document.getElementById('stickerCancelBtn');\nconst closeStickers = document.getElementById('closeStickers');\nconst stickerGhost = document.getElementById('stickerGhost');\n\n/* ---------- Render category list ---------- */\nfunction renderStickerCats() {\n  stickerCatsEl.innerHTML = '';\n  stickerCategories.forEach(cat => {\n    const row = document.createElement('div');\n    row.className = 'sticker-cat-row' + (cat.id === stickerState.activeCatId ? ' active' : '');\n    row.dataset.cat = cat.id;\n    const ico = document.createElement('div');\n    ico.className = 'cat-ico';\n    if (cat.catIcon.e) ico.textContent = cat.catIcon.e;\n    else ico.innerHTML = cat.catIcon.s;\n    const label = document.createElement('span');\n    label.textContent = cat.name;\n    row.appendChild(ico);\n    row.appendChild(label);\n    row.addEventListener('mousedown', () => {\n      stickerState.activeCatId = cat.id;\n      stickerState.selectedIdx = -1;\n      stickerState.selectedSticker = null;\n      updateInsertBtn();\n      renderStickerCats();\n      renderStickerGrid();\n    });\n    stickerCatsEl.appendChild(row);\n  });\n}\n\n/* ---------- Render sticker grid ---------- */\nfunction renderStickerGrid() {\n  const cat = stickerCategories.find(c => c.id === stickerState.activeCatId);\n  if (!cat) return;\n  stickerCatNameEl.textContent = cat.name;\n  stickerGridEl.innerHTML = '';\n  cat.stickers.forEach((st, i) => {\n    const cell = document.createElement('div');\n    cell.className = 'sticker-cell' + (i === stickerState.selectedIdx ? ' selected' : '');\n    if (st.e) cell.textContent = st.e;\n    else cell.innerHTML = st.s;\n    cell.addEventListener('mousedown', () => {\n      stickerState.selectedIdx = i;\n      stickerState.selectedSticker = st;\n      updateInsertBtn();\n      renderStickerGrid();\n    });\n    cell.addEventListener('dblclick', () => {\n      stickerState.selectedIdx = i;\n      stickerState.selectedSticker = st;\n      confirmStickerSelection();\n    });\n    stickerGridEl.appendChild(cell);\n  });\n}\n\nfunction updateInsertBtn() {\n  if (stickerState.selectedSticker) stickerInsertBtn.classList.remove('disabled');\n  else stickerInsertBtn.classList.add('disabled');\n}\n\n/* ---------- Open / close picker ---------- */\nfunction openStickerPicker() {\n  stickerModal.classList.add('open');\n  stickerBtn.classList.add('active');\n  stickerState.selectedIdx = -1;\n  stickerState.selectedSticker = null;\n  updateInsertBtn();\n  renderStickerCats();\n  renderStickerGrid();\n}\nfunction closeStickerPicker() {\n  stickerModal.classList.remove('open');\n  stickerBtn.classList.remove('active');\n}\n\nstickerBtn.addEventListener('mousedown', openStickerPicker);\ncloseStickers.addEventListener('mousedown', closeStickerPicker);\nstickerCancelBtn.addEventListener('mousedown', closeStickerPicker);\nstickerInsertBtn.addEventListener('mousedown', () => {\n  if (stickerInsertBtn.classList.contains('disabled')) return;\n  confirmStickerSelection();\n});\n\nfunction confirmStickerSelection() {\n  if (!stickerState.selectedSticker) return;\n  closeStickerPicker();\n  enterStickerPlaceMode(stickerState.selectedSticker);\n}\n\n/* ---------- Placement mode ---------- */\nfunction enterStickerPlaceMode(st) {\n  stickerState.placing = true;\n  // also leave the current draw tool selected; sticker placement intercepts\n  document.querySelector('.canvas-wrap').classList.add('placing');\n  // populate ghost preview\n  if (st.e) stickerGhost.textContent = st.e;\n  else stickerGhost.innerHTML = st.s;\n  stickerGhost.classList.add('show');\n  sbHelp.textContent = 'Click on the canvas to place the sticker. Esc to cancel.';\n}\n\nfunction exitStickerPlaceMode() {\n  stickerState.placing = false;\n  stickerGhost.classList.remove('show');\n  document.querySelector('.canvas-wrap').classList.remove('placing');\n  // restore tool help text\n  const t = toolDefs.find(t => t.id === state.tool);\n  if (t) sbHelp.textContent = `${t.name} — ` + helpFor(state.tool);\n}\n\n/* track ghost position over canvas */\ncanvas.addEventListener('mousemove', (e) => {\n  if (!stickerState.placing) return;\n  const r = canvasFrame.getBoundingClientRect();\n  stickerGhost.style.left = (e.clientX - r.left) + 'px';\n  stickerGhost.style.top  = (e.clientY - r.top) + 'px';\n});\n\n/* place on click — capture phase so it intercepts before drawing tools */\ncanvas.addEventListener('mousedown', (e) => {\n  if (!stickerState.placing) return;\n  e.stopImmediatePropagation();\n  e.preventDefault();\n  const p = getPos(e);\n  placeSticker(stickerState.selectedSticker, p.x, p.y);\n  exitStickerPlaceMode();\n}, true);\n\n/* Esc cancels placement */\ndocument.addEventListener('keydown', (e) => {\n  if (e.key === 'Escape' && stickerState.placing) {\n    exitStickerPlaceMode();\n  }\n});\n\n/* ---------- Render a sticker into the canvas ---------- */\nfunction placeSticker(st, cx, cy) {\n  pushUndo();\n  const size = 64; // sticker pixel size on canvas\n  if (st.e) {\n    // render emoji via temp canvas to ensure consistent baseline + size\n    const tmp = document.createElement('canvas');\n    tmp.width = size; tmp.height = size;\n    const tctx = tmp.getContext('2d');\n    tctx.imageSmoothingEnabled = false;\n    tctx.textAlign = 'center';\n    tctx.textBaseline = 'middle';\n    tctx.font = (size * 0.85) + 'px \"Segoe UI Emoji\",\"Apple Color Emoji\",\"Noto Color Emoji\",sans-serif';\n    tctx.fillText(st.e, size/2, size/2 + 2);\n    ctx.imageSmoothingEnabled = false;\n    ctx.drawImage(tmp, cx - size/2, cy - size/2);\n  } else if (st.s) {\n    // render SVG via Image + data URL\n    const svg = st.s;\n    const blob = new Blob([svg], { type: 'image/svg+xml' });\n    const url = URL.createObjectURL(blob);\n    const img = new Image();\n    img.onload = () => {\n      ctx.imageSmoothingEnabled = false;\n      ctx.drawImage(img, cx - size/2, cy - size/2, size, size);\n      URL.revokeObjectURL(url);\n    };\n    img.onerror = () => URL.revokeObjectURL(url);\n    img.src = url;\n  }\n}\n\n/* Click outside modal closes it */\nstickerModal.addEventListener('mousedown', (e) => {\n  if (e.target === stickerModal) closeStickerPicker();\n});\n\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
